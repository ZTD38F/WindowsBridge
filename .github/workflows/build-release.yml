name: Build Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "mcp[cli]==2.3.0" psutil==7.1.3
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build standalone WindowsBridge.exe
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name WindowsBridge --collect-all mcp windowsbridge_v2.py
          if (-not (Test-Path dist\WindowsBridge.exe)) { throw "WindowsBridge.exe was not built" }
          $hash = (Get-FileHash dist\WindowsBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsBridge.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII
          $env:GITHUB_SHA | Set-Content dist\SOURCE_COMMIT.txt -Encoding ASCII

      - uses: actions/upload-artifact@v6
        with:
          name: WindowsBridge-windows-amd64
          path: |
            dist/WindowsBridge.exe
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt

      - name: Publish edge GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create edge --target "$env:GITHUB_SHA" --title "WindowsBridge edge" --notes "Automated development build from main." --prerelease
          }
          gh release upload edge dist\WindowsBridge.exe dist\SHA256SUMS.txt dist\SOURCE_COMMIT.txt --clobber

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist\WindowsBridge.exe dist\SHA256SUMS.txt dist\SOURCE_COMMIT.txt --title "WindowsBridge $env:GITHUB_REF_NAME" --generate-notes
