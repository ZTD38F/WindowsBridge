name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3

      - name: Build standalone WindowsBridge.exe
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --console --name WindowsBridge windowsbridge_v2.py
          if (-not (Test-Path dist\WindowsBridge.exe)) { throw "WindowsBridge.exe was not built" }
          $hash = (Get-FileHash dist\WindowsBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsBridge.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ASCII

      - name: Smoke test executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\WindowsBridge.exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            throw "WindowsBridge.exe exited during startup smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v6
        with:
          name: WindowsBridge-windows-amd64
          path: |
            dist/WindowsBridge.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist\WindowsBridge.exe dist\SHA256SUMS.txt --title "WindowsBridge $env:GITHUB_REF_NAME" --generate-notes
