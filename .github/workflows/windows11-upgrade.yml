name: Windows 11 Upgrade Manager tests
on:
  push:
    paths:
      - 'tools/windows11-upgrade/**'
      - '.github/workflows/windows11-upgrade.yml'
  pull_request:
    paths:
      - 'tools/windows11-upgrade/**'
      - '.github/workflows/windows11-upgrade.yml'
permissions:
  contents: read
jobs:
  powershell-5_1:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax and offline tests
        shell: powershell
        run: .\tools\windows11-upgrade\tests\test.ps1
