name: Release

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Resolve release version
        shell: pwsh
        run: |
          $m = Select-String -Path windowsbridge.py -Pattern '^VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"$'
          if (-not $m) { throw "WindowsBridge semantic version not found." }
          $version = $m.Matches[0].Groups[1].Value
          "VERSION=$version" | Add-Content $env:GITHUB_ENV
          "TAG=v$version" | Add-Content $env:GITHUB_ENV
      - name: Validate release source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check mcp==2.3.0 psutil==7.1.3
          python -m py_compile windowsbridge.py http_runtime.py supervisor.py
          $failed=$false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$failed=$true;$errors|Write-Host}
          }
          if($failed){exit 1}
      - name: Exercise release integration gates
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python integration tests failed." }

          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\update_recovery_integration.ps1
          if ($LASTEXITCODE -ne 0) { throw "Updater recovery integration tests failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\update_mutex_integration.ps1
          if ($LASTEXITCODE -ne 0) { throw "Updater mutex integration tests failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\update_tunnel_continuity_integration.ps1
          if ($LASTEXITCODE -ne 0) { throw "Tunnel continuity integration tests failed." }
      - name: Build immutable release bundle
        shell: pwsh
        run: |
          $dir = "WindowsBridge-$env:TAG"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item windowsbridge.py,http_runtime.py,supervisor.py,requirements.lock,install.ps1,update.ps1,update-state.psm1,windowsbridgectl.ps1,TUNNEL_CLIENT_VERSION,README.md $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"
          $hash=(Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $dir.zip" | Set-Content SHA256SUMS.txt -Encoding ASCII
          [ordered]@{
            schema_version=1
            bridge="WindowsBridge"
            source_commit="${{ github.sha }}"
            version=$env:VERSION
            tag=$env:TAG
            update_kind="runtime"
            supervisor_protocol=1
            config_schema=1
            state_schema=2
          } | ConvertTo-Json | Set-Content bridge-release.json -Encoding UTF8
      - name: Attest artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            WindowsBridge-*.zip
            SHA256SUMS.txt
            bridge-release.json
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:TAG *> $null) {
            $target = gh release view $env:TAG --json targetCommitish --jq .targetCommitish
            if ($target -ne "${{ github.sha }}" -and $target -ne "stable") {
              throw "Release $env:TAG already exists for a different target."
            }
            Write-Host "Release $env:TAG already exists."
          } else {
            gh release create $env:TAG WindowsBridge-*.zip SHA256SUMS.txt bridge-release.json --target "${{ github.sha }}" --title "WindowsBridge $env:TAG" --generate-notes
          }
