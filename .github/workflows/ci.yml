name: CI

on:
  push:
    branches: [main, stable]
  pull_request: # Run checks on stacked preview PRs as well as main/stable PRs

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check mcp==2.3.0 psutil==7.1.3
      - name: Compile WindowsBridge
        shell: pwsh
        run: python -m py_compile windowsbridge.py http_runtime.py supervisor.py
      - name: Exercise atomic generation routing
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Verify MCPServer import
        shell: pwsh
        run: python -c "from mcp.server import MCPServer; print('MCPServer OK')"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Exercise installer preflight in Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSEdition -ne "Desktop" -or $PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected the default Windows PowerShell 5.1 host."
          }
          $preflight = (.\install.ps1 -PreflightOnly | Out-String) | ConvertFrom-Json
          if (-not $preflight.ok -or -not $preflight.windows_64_bit) {
            throw "Installer preflight did not validate the Windows runner."
          }
          if ($preflight.powershell_edition -ne "Desktop") {
            throw "Installer preflight did not execute in Windows PowerShell."
          }

      - name: Verify installer credential output safety
        shell: powershell
        run: .\tests\installer_credential_output_integration.ps1

      - name: Verify incorrect tunnel ID diagnostic
        shell: powershell
        run: .\tests\tunnel_id_diagnostic_integration.ps1

      - name: Verify guided tunnel enrollment
        shell: powershell
        run: .\tests\tunnel_enrollment_integration.ps1
      - name: Verify entire onboarding UI without network or real secrets
        shell: powershell
        run: .\tests\onboarding_flow_integration.ps1
      - name: Validate copied Win+R launcher on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\launcher_contract_integration.ps1

      - name: Verify signed release asset digest
        shell: powershell
        run: .\tests\release_asset_digest_integration.ps1

      - name: Verify tunnel secret ACLs on Windows
        shell: powershell
        run: .\tests\secret_acl_integration.ps1

      - name: Exercise scripts from a path with spaces and Unicode
        shell: powershell
        run: .\tests\path_unicode_integration.ps1

      - name: Exercise Windows reboot service recovery
        shell: powershell
        run: .\tests\reboot_service_recovery_integration.ps1

      - name: Exercise uninstaller data preservation
        shell: powershell
        run: .\tests\uninstall_data_preservation_integration.ps1

      - name: Exercise updater recovery and concurrency contracts
        shell: powershell
        run: |
          .\\tests\\update_recovery_integration.ps1
          .\\tests\\update_mutex_integration.ps1
          .\\tests\\update_tunnel_continuity_integration.ps1

      - name: Validate minimal naming and truthful installation docs
        shell: pwsh
        run: |
          $readme = Get-Content README.md -Raw
          $quick = Get-Content QUICKSTART.txt -Raw
          foreach ($doc in @($readme, $quick)) {
            if ($doc -match '(?i)select copy command|its copy button|WindowsBridge Runtime -|WindowsBridge - <COMPUTERNAME>') {
              throw 'Stale onboarding text or machine-specific resource name.'
            }
          }
          if (-not $readme.Contains('plain-text PowerShell source endpoint') -or
              -not $quick.Contains('Elevated installation defaults to')) {
            throw 'Source-channel vs stable-install behavior was not documented.'
          }
      - name: Validate first-run onboarding contract
        shell: pwsh
        run: |
          $installer = Get-Content install.ps1 -Raw
          $required = @(
            "https://platform.openai.com/settings/organization/tunnels",
            "https://platform.openai.com/settings/organization/api-keys",
            "https://chatgpt.com/plugins",
            "Add custom MCP server",
            "READ-ONLY WindowsBridge system-information tool",
            "Only that successful call verifies the end-to-end connection.",
            "Name: WindowsBridge",
            "WindowsBridge  [1/3]  Tunnel",
            "WindowsBridge  [2/3]  API key",
            "WindowsBridge  [3/3]  ChatGPT",
            "Tunnels -> Read + Use",
            "Create as a plugin",
            "No authentication (NoAuth)"
          )
          foreach ($value in $required) {
            if (-not $installer.Contains($value)) {
              throw "Required onboarding contract text is missing: $value"
            }
          }

      - name: Validate runtime safety and auto-update contract
        shell: pwsh
        run: |
          $agent = Get-Content windowsbridge.py -Raw
          $installer = Get-Content install.ps1 -Raw
          $updater = Get-Content update.ps1 -Raw
          $uninstaller = Get-Content uninstall.ps1 -Raw
          $ctl = Get-Content windowsbridgectl.ps1 -Raw

          $toolCount = ([regex]'@mcp\.tool\(annotations=').Matches($agent).Count
          if ($toolCount -ne 40) { throw "Expected 40 annotated MCP tools; found $toolCount" }

          $requiredInstaller = @(
            'S-1-5-18',
            'S-1-5-32-544',
            'Global\WindowsBridgeTunnelRuntime',
            '127.0.0.1:18765',
            'WindowsBridge Auto Update',
            'UV_PYTHON_INSTALL_DIR',
            'management\update.ps1',
            'management\windowsbridgectl.ps1',
            'function Resolve-SourceCommit',
            '$ResolvedBootstrapRef = Resolve-SourceCommit $SourceRef',
            'raw.githubusercontent.com/$Repo/$ResolvedBootstrapRef/install.ps1',
            '"-SourceRef",$ResolvedBootstrapRef'
          )
          foreach ($value in $requiredInstaller) {
            if (-not $installer.Contains($value)) { throw "Missing installer safety contract: $value" }
          }

          if ($installer.Contains('raw.githubusercontent.com/ZTD38F/WindowsBridge/$SourceRef/install.ps1')) {
            throw "Elevation bootstrap must not redownload from a mutable source ref."
          }

          $requiredUninstaller = @(
            'function Resolve-SourceCommit',
            '$ResolvedBootstrapRef = Resolve-SourceCommit $SourceRef',
            'raw.githubusercontent.com/$Repo/$ResolvedBootstrapRef/uninstall.ps1',
            '"-SourceRef",$ResolvedBootstrapRef'
          )
          foreach ($value in $requiredUninstaller) {
            if (-not $uninstaller.Contains($value)) { throw "Missing uninstaller safety contract: $value" }
          }
          if ($uninstaller.Contains('raw.githubusercontent.com/ZTD38F/WindowsBridge/stable/uninstall.ps1')) {
            throw "Elevation bootstrap must not redownload the uninstaller from a mutable source ref."
          }

          $requiredUpdater = @(
            'releases/latest',
            'CANDIDATE_HEALTHY',
            'Set-Route $targetSha $candidatePort',
            'DEFERRED_STATEFUL_HANDLES',
            'DRAINING_OLD',
            'FAILED_ROLLED_BACK',
            'Update-Supervisor',
            'Update-Transport'
          )
          foreach ($value in $requiredUpdater) {
            if (-not $updater.Contains($value)) { throw "Missing seamless update contract: $value" }
          }
          if (-not $installer.Contains('--mcp.server-url')) { throw "Installer must use decoupled HTTP MCP transport." }
          if (-not $installer.Contains('supervisor.py')) { throw "Installer must deploy the long-lived supervisor." }
          if (-not $ctl.Contains('update-status')) { throw "Control CLI must expose update state." }

  visual-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Playwright harness
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
      - name: Find a Chromium browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Real Chromium responsive and clipboard E2E
        env:
          WINDOWSBRIDGE_VISUAL_DIR: ${{ runner.temp }}/windowsbridge-visual
        run: node pages/visual.test.mjs
      - name: Retain real browser screenshots for independent review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowsbridge-visual-preview
          path: ${{ runner.temp }}/windowsbridge-visual/*.png
          if-no-files-found: warn

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,})' .; then
            echo "Potential credential committed to repository"
            exit 1
          fi
      - name: Reject non-GitHub WindowsBridge download origins
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'sonoryx\.store|windowsbridge\.sonoryx' .; then
            echo "WindowsBridge installation must not depend on a personal server"
            exit 1
          fi

  pages-installer-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Cloudflare Pages routing and allowlisted build
        shell: bash
        run: |
          node --test pages/site.test.mjs
          bash pages/build-site.sh "$RUNNER_TEMP/windowsbridge-pages"
      - name: Package immutable isolated Pages preview
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/windowsbridge-pages"
          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -eq 4
          (
            cd "$out"
            sha256sum _worker.js index.html style.css app.js > SHA256SUMS
            printf 'github_repo=ZTD38F/WindowsBridge\nsource_commit=%s\nci_tested_checkout_commit=%s\nsource_branch=%s\npreview_only=true\nproduction_deploy=false\nrequired_preview_REDIRECT_URL=https://raw.githubusercontent.com/ZTD38F/WindowsBridge/stable/install.ps1\n' \
              "${{ github.event.pull_request.head.sha || github.sha }}" "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" > PREVIEW_MANIFEST.txt
            sha256sum -c SHA256SUMS
          )
      - name: Preserve independently verified preview package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windowsbridge-pages-preview
          path: ${{ runner.temp }}/windowsbridge-pages/
          if-no-files-found: error
          retention-days: 14
