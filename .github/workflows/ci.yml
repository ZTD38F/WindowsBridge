name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check mcp==2.3.0 psutil==7.1.3
      - name: Compile WindowsBridge
        shell: pwsh
        run: python -m py_compile windowsbridge.py
      - name: Verify MCPServer import
        shell: pwsh
        run: python -c "from mcp.server import MCPServer; print('MCPServer OK')"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate first-run onboarding contract
        shell: pwsh
        run: |
          $installer = Get-Content install.ps1 -Raw
          $required = @(
            "https://platform.openai.com/settings/organization/tunnels",
            "https://platform.openai.com/settings/organization/api-keys",
            "https://chatgpt.com/#settings/Connectors",
            "WindowsBridge Runtime",
            "Tunnels -> Read",
            "Tunnels -> Use",
            "No authentication (NoAuth)"
          )
          foreach ($value in $required) {
            if (-not $installer.Contains($value)) {
              throw "Required onboarding contract text is missing: $value"
            }
          }

      - name: Validate runtime safety and auto-update contract
        shell: pwsh
        run: |
          $agent = Get-Content windowsbridge.py -Raw
          $installer = Get-Content install.ps1 -Raw
          $updater = Get-Content update.ps1 -Raw
          $ctl = Get-Content windowsbridgectl.ps1 -Raw

          $toolCount = ([regex]'@mcp\.tool\(annotations=').Matches($agent).Count
          if ($toolCount -ne 40) { throw "Expected 40 annotated MCP tools; found $toolCount" }

          $requiredInstaller = @(
            'S-1-5-18',
            'S-1-5-32-544',
            'Global\WindowsBridgeTunnelRuntime',
            '127.0.0.1:18765',
            'WindowsBridge Auto Update',
            'UV_PYTHON_INSTALL_DIR',
            'management\update.ps1',
            'management\update-state.psm1',
            'management\windowsbridgectl.ps1',
            'function Resolve-SourceCommit',
            '$ResolvedBootstrapRef = Resolve-SourceCommit $SourceRef',
            'raw.githubusercontent.com/$Repo/$ResolvedBootstrapRef/install.ps1',
            '"-SourceRef",$ResolvedBootstrapRef'
          )
          foreach ($value in $requiredInstaller) {
            if (-not $installer.Contains($value)) { throw "Missing installer safety contract: $value" }
          }

          if ($installer.Contains('raw.githubusercontent.com/ZTD38F/WindowsBridge/$SourceRef/install.ps1')) {
            throw "Elevation bootstrap must not redownload from a mutable source ref."
          }

          if (-not $updater.Contains('commits/$Channel')) { throw "Updater must resolve a channel to an immutable Git commit." }
          if (-not $updater.Contains('-AutoUpdate')) { throw "Updater must use noninteractive install mode." }
          if (-not $updater.Contains('LEGACY_RESTARTING')) { throw "Legacy restart updates must be reported truthfully." }
          if (-not $ctl.Contains('readyz')) { throw "Control CLI must expose readiness checks." }
          if (-not $ctl.Contains('"update-now"')) { throw "Control CLI must expose update-now." }
          if (-not $ctl.Contains('"update-status"')) { throw "Control CLI must expose update-status." }

      - name: Verify durable update-state transitions
        shell: pwsh
        run: |
          Import-Module .\update-state.psm1 -Force
          $dir = Join-Path $env:RUNNER_TEMP ("windowsbridge-state-" + [guid]::NewGuid().ToString("N"))
          $path = Join-Path $dir "update-state.json"
          $generation = [guid]::NewGuid().ToString("N")
          $current = "a" * 40
          $candidate = "b" * 40
          try {
            Write-WindowsBridgeUpdateState -Path $path -State "DOWNLOADED" -GenerationId $generation -UpdateClass "APPLICATION" -CurrentGeneration $current -CandidateGeneration $candidate -PreviousGeneration $current -Reason "test_downloaded"
            $first = Read-WindowsBridgeUpdateState -Path $path
            if ($first.state -ne "DOWNLOADED") { throw "Initial update state was not persisted." }
            if ($first.candidate_generation -ne $candidate) { throw "Candidate generation was not persisted." }

            Write-WindowsBridgeUpdateState -Path $path -State "COMMITTED" -GenerationId $generation -UpdateClass "APPLICATION" -CurrentGeneration $candidate -PreviousGeneration $current -Reason "test_committed"
            $second = Read-WindowsBridgeUpdateState -Path $path
            if ($second.state -ne "COMMITTED") { throw "Atomic update-state replacement failed." }
            if ($second.current_generation -ne $candidate) { throw "Committed generation is incorrect." }
            if (Get-ChildItem $dir -Filter ".update-state-*.tmp") { throw "Temporary state files were not cleaned up." }

            $invalidRejected = $false
            try {
              Write-WindowsBridgeUpdateState -Path $path -State "COMMITTED" -GenerationId $generation -UpdateClass "APPLICATION" -CurrentGeneration "not-a-sha" -Reason "invalid"
            } catch {
              $invalidRejected = $true
            }
            if (-not $invalidRejected) { throw "Invalid generation SHA was accepted." }
          } finally {
            Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
          }

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,})' .; then
            echo "Potential credential committed to repository"
            exit 1
          fi
      - name: Reject non-GitHub WindowsBridge download origins
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'sonoryx\.store|windowsbridge\.sonoryx' .; then
            echo "WindowsBridge installation must not depend on a personal server"
            exit 1
          fi
