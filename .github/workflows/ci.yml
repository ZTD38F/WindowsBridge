name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check mcp==2.3.0 psutil==7.1.3
      - name: Compile WindowsBridge
        shell: pwsh
        run: python -m py_compile windowsbridge.py http_runtime.py supervisor.py
      - name: Exercise atomic generation routing
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Verify MCPServer import
        shell: pwsh
        run: python -c "from mcp.server import MCPServer; print('MCPServer OK')"
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors | Out-String)"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate first-run onboarding contract
        shell: pwsh
        run: |
          $installer = Get-Content install.ps1 -Raw
          $required = @(
            "https://platform.openai.com/settings/organization/tunnels",
            "https://platform.openai.com/settings/organization/api-keys",
            "https://chatgpt.com/#settings/Connectors",
            "WindowsBridge Runtime",
            "Tunnels -> Read",
            "Tunnels -> Use",
            "No authentication (NoAuth)"
          )
          foreach ($value in $required) {
            if (-not $installer.Contains($value)) {
              throw "Required onboarding contract text is missing: $value"
            }
          }

      - name: Validate runtime safety and auto-update contract
        shell: pwsh
        run: |
          $agent = Get-Content windowsbridge.py -Raw
          $installer = Get-Content install.ps1 -Raw
          $updater = Get-Content update.ps1 -Raw
          $ctl = Get-Content windowsbridgectl.ps1 -Raw

          $toolCount = ([regex]'@mcp\.tool\(annotations=').Matches($agent).Count
          if ($toolCount -ne 40) { throw "Expected 40 annotated MCP tools; found $toolCount" }

          $requiredInstaller = @(
            'S-1-5-18',
            'S-1-5-32-544',
            'Global\WindowsBridgeTunnelRuntime',
            '127.0.0.1:18765',
            'WindowsBridge Auto Update',
            'UV_PYTHON_INSTALL_DIR',
            'management\update.ps1',
            'management\windowsbridgectl.ps1',
            'function Resolve-SourceCommit',
            '$ResolvedBootstrapRef = Resolve-SourceCommit $SourceRef',
            'raw.githubusercontent.com/$Repo/$ResolvedBootstrapRef/install.ps1',
            '"-SourceRef",$ResolvedBootstrapRef'
          )
          foreach ($value in $requiredInstaller) {
            if (-not $installer.Contains($value)) { throw "Missing installer safety contract: $value" }
          }

          if ($installer.Contains('raw.githubusercontent.com/ZTD38F/WindowsBridge/$SourceRef/install.ps1')) {
            throw "Elevation bootstrap must not redownload from a mutable source ref."
          }

          $requiredUpdater = @(
            'releases/latest',
            'CANDIDATE_HEALTHY',
            'Set-Route $targetSha $candidatePort',
            'DEFERRED_STATEFUL_HANDLES',
            'DRAINING_OLD',
            'FAILED_ROLLED_BACK',
            'Update-Supervisor',
            'Update-Transport'
          )
          foreach ($value in $requiredUpdater) {
            if (-not $updater.Contains($value)) { throw "Missing seamless update contract: $value" }
          }
          if (-not $installer.Contains('--mcp.server-url')) { throw "Installer must use decoupled HTTP MCP transport." }
          if (-not $installer.Contains('supervisor.py')) { throw "Installer must deploy the long-lived supervisor." }
          if (-not $ctl.Contains('update-status')) { throw "Control CLI must expose update state." }

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9_-]{16,}|github_pat_[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,})' .; then
            echo "Potential credential committed to repository"
            exit 1
          fi
      - name: Reject non-GitHub WindowsBridge download origins
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' 'sonoryx\.store|windowsbridge\.sonoryx' .; then
            echo "WindowsBridge installation must not depend on a personal server"
            exit 1
          fi
